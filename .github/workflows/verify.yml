name: Verify listings
on:
  schedule:
    - cron: "30 13 * * *"   # 6:30 AM Vancouver
    - cron: "30 1 * * *"    # 6:30 PM Vancouver
  push:
    paths: ["jobs.json", "signals.json"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: verify
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node test/lib.test.js
      - run: node crawl.js
        continue-on-error: true
      - run: node verify.js
      - name: Alert on feed problems
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node alert.js
      - name: Publish data.json
        run: |
          git config user.name "listing-checker"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git add data.json jobs.json crawl-report.json coverage.json boards.json
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -m "Verified listings $(date -u +%F)"
            if git pull --rebase origin main && git push; then exit 0; fi
            # a search task pushed while we were checking: start over from the latest
            git rebase --abort || true
            git fetch origin main && git reset --hard origin/main
            node crawl.js || true
            node verify.js || true
          done
          exit 1
      - name: Open an issue if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          N=$(gh issue list --state open --search '"Listing checker failed" in:title' --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "Failed again. Run: $RUN"; else gh issue create --title "Listing checker failed" --body "The daily check failed or the sanity gate stopped publishing. Run: $RUN"; fi
